[package]
name = "babry"
version = "0.2.1"
edition = "2024"

[dependencies]
libc = "0.2"
libloading = "0.8"
memmap2 = "0.9"
png = "0.18"
tiny-skia = { version = "0.11", default-features = false, features = ["std", "simd"] }
ttf-parser = "0.25"
svgtypes = "0.16"
serde_json = "1"
smithay-client-toolkit = { version = "0.20", default-features = false, features = ["xkbcommon"] }
x11rb = { version = "0.13", default-features = false, features = ["shm", "randr", "allow-unsafe-code"] }
toml = { version = "1.1", default-features = false, features = ["parse", "std", "serde"] }
image = { version = "0.25", default-features = false, optional = true }
oar-ocr = { version = "0.11", default-features = false, features = ["simd"], optional = true }
ort = { version = "=2.0.0-rc.15", default-features = false, features = ["std", "load-dynamic", "api-24"], optional = true }

[features]
ocr = ["dep:image", "dep:oar-ocr", "dep:ort"]

[dev-dependencies]
tempfile = "3"
wayland-protocols-plasma = { version = "0.3", features = ["client"] }

[profile.dev]
opt-level = 1

[profile.dev.package."*"]
opt-level = 3

[profile.release]
opt-level = "z"
lto = "fat"
codegen-units = 1
panic = "abort"
strip = "symbols"
